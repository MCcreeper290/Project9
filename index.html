<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 9</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: #000000;
            text-decoration: none;
            letter-spacing: -0.05em;
        }

        nav a {
            font-size: 0.9rem;
            font-weight: 600;
            color: #666666;
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #000000;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 5rem 2rem;
            flex-grow: 1;
        }

        .content-card {
            background: #ffffff;
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: #111111;
        }

        p {
            font-size: 1.125rem;
            color: #4a4a4a;
            font-weight: 400;
        }

        @media (max-width: 600px) {
            main {
                padding: 2.5rem 1rem;
            }
            .content-card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
        a {
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.svg" class="logo">Project9.</a>
            <nav>
                <a href="index.svg">Home</a>
                <a href="page1.svg">Articles</a>
                <a href="page2.svg">Research & Development</a>
            </nav>
        </div>
    </header>

    <main>
        <article class="content-card">
            <h1>Project 9</h1>
            <p>all of the official files and research for project 9 are on this site.</p>
            <img src="https://uploads.onecompiler.io/44cuptdk5/1781207094249/Project9.png" alt="Photo of Project 9 Version 2.0" width="500" height="300">

        </article>
    </main>
  <a>-The Project 9 Team</a>
</body>
</html>
